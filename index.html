<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="terminal-screen">
        <div class="log">INITIALIZING SYSTEM...</div>
    </div>

    <div id="dashboard-screen" style="display:none;">
        <h1>SECURESPHERE</h1>
        <button id="start-btn" class="neu-btn">Start Chatting</button>
    </div>

    <div id="chat-screen" style="display:none;">
        <div class="chat-header">
            <span>Chat Room</span>
            <button id="exit-btn">Exit</button>
            <button id="dissolve-btn" style="color:red;">Dissolve</button>
        </div>
        <div id="msg-box"></div>
        <div class="input-bar">
            <input type="text" id="msg-input" placeholder="Message...">
            <button id="send-btn">+</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
